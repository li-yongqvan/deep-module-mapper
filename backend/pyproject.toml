[project]
name = "deep-module-mapper-backend"
version = "0.1.0"
description = "HTTP API for Deep Module Mapper scan jobs."
requires-python = ">=3.10"
dependencies = [
    "starlette >=1.3.1,<2",
    "uvicorn[standard] >=0.30",
    "pydantic >=2",
    "deep-module-mapper-parser",
]

[project.optional-dependencies]
test = ["pytest", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
